<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>DailyHalal 수요 설문</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 11-08 데일리할랄 수요 설문(국문·영문) — 11-06 시식회 설문(=평소 /exp_survey 틀) 재사용: 알약 보기·1~5 점수칸 없음·색은 데일리할랄 초록 */
:root{
  --ground:#FFFFFF; --surface:#F5F9F7; --ink:#14201A; --muted:#76857E;
  --line:#DFE7E3; --main:#0F7A4A; --main-deep:#0A5A36; --warn:#B3261E;
  --display:"Black Han Sans","Noto Sans KR",sans-serif;
  --body:"Noto Sans KR","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--ground);color:var(--ink);font-family:var(--body);line-height:1.65;-webkit-text-size-adjust:100%}
.bar{position:sticky;top:0;height:3px;background:var(--line);z-index:20}
.bar>i{display:block;height:100%;width:0;background:var(--main);transition:width .25s ease}
header.mast{background:var(--main);color:#fff;text-align:center;padding:22px 16px 18px}
header.mast .brand{font-family:var(--display);font-size:34px;line-height:1.1;letter-spacing:.02em}
header.mast small{display:block;font-size:13px;opacity:.85;margin-top:4px}
.wrap{max-width:620px;margin:0 auto;padding-inline:20px;padding-block:0 64px}
.intro{padding-block:30px 8px}
.intro h1{font-family:var(--display);font-size:clamp(25px,6.6vw,34px);line-height:1.28;margin:0 0 16px;text-wrap:balance;word-break:keep-all;font-weight:400}
.intro p{margin:0 0 12px;font-size:15.5px;color:#33403A}
.intro .mins{display:block;margin-top:6px;font-size:13.5px;color:var(--muted)}
section{padding-block:30px;border-top:1px solid var(--line)}
.q{padding-block:26px;border-top:1px dashed var(--line)}
.q:first-child{border-top:0;padding-top:0}
.q:last-child{padding-bottom:0}
.q>.qt{display:block;font-size:15.5px;font-weight:500;margin:0 0 10px}
.qt .opt{font-size:13px;color:var(--muted);font-weight:400}
.no{display:inline-block;min-width:1.7em;color:var(--main);font-family:var(--display);font-weight:400;font-size:17px}
.req{font-size:12.5px;color:var(--warn);font-weight:700}
.q.err{background:#FDF1F0;border-radius:8px;outline:2px solid var(--warn);outline-offset:6px}
.choices{display:flex;flex-wrap:wrap;gap:8px}
.choices label{cursor:pointer}
.choices input{position:absolute;opacity:0;width:0;height:0}
.choices span{display:inline-block;padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:var(--ground);font-size:14.5px;transition:background .12s,border-color .12s,color .12s}
.choices input:checked+span{background:var(--main);border-color:var(--main);color:#fff;font-weight:500}
.choices input:focus-visible+span{outline:2px solid var(--main-deep);outline-offset:2px}
textarea,input[type=text]{width:100%;font-family:var(--body);font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 13px;resize:vertical}
textarea:focus,input[type=text]:focus{outline:2px solid var(--main);outline-offset:1px;background:var(--ground)}
textarea{min-height:96px}
.other{margin-top:8px}
input[type=text]+input[type=text]{margin-top:8px}
/* 사진 4장 = 한 줄 4칸(360~420px 폰에서도 가로 스크롤 없음) */
.photos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:10px}
.ph{position:relative;border:2px solid var(--line);border-radius:10px;overflow:hidden;background:var(--ground);cursor:pointer;padding:0;text-align:left;font:inherit;color:inherit}
.ph img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#eee}
.ph span{display:block;padding:5px 5px 7px;font-size:11.5px;font-weight:500;line-height:1.3;word-break:keep-all;overflow-wrap:anywhere}
.ph .ck{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.92);border:2px solid #9aa7a1;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:#fff}
.ph.on{border-color:var(--main)}
.ph.on .ck{background:var(--main);border-color:var(--main)}
.ph.on .ck::after{content:"✓"}
.cnt{font-size:13px;color:var(--main);font-weight:700;margin-top:8px}
.pv{font-size:13px;line-height:1.6;color:#33403A;background:var(--surface);border-radius:8px;padding:11px 13px;margin:0 0 10px}
.pv b{display:block;margin-bottom:3px}
.submit-area{padding-top:30px;border-top:1px solid var(--line)}
button.send{width:100%;font-family:var(--display);font-weight:400;font-size:20px;color:#fff;background:var(--main);border:0;border-radius:10px;padding:17px;cursor:pointer}
button.send:disabled{opacity:.6}
.msg{margin:12px 0 0;font-size:14px;color:var(--warn);text-align:center;font-weight:500;min-height:20px}
.done{padding-block:56px 40px;text-align:center}
.done h2{font-family:var(--display);font-size:30px;font-weight:400;margin:0 0 18px}
.done p{margin:0 0 10px;font-size:15.5px;color:#33403A}
.langs{display:flex;justify-content:center;gap:6px;margin-top:12px}
.langs button{font:inherit;font-size:13.5px;font-weight:500;color:#fff;background:transparent;border:1px solid rgba(255,255,255,.6);border-radius:999px;padding:5px 13px;cursor:pointer}
.langs button.on{background:#fff;color:var(--main);border-color:#fff;font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="bar"><i id="bar"></i></div>
<header class="mast"><div class="brand" data-t>데일리할랄</div><small data-t>서울 할랄 도시락 수요 설문</small>
  <div class="langs" id="langs"><button type="button" data-lang="ko">한국어</button><button type="button" data-lang="en">English</button></div>
</header>

<div class="wrap" id="form">
  <div class="intro">
    <h1 data-t>안녕하세요, 데일리할랄입니다.</h1>
    <p data-t>진주에서 경대케밥을 운영하며 할랄인증 사용한 소고기와 닭고기로 케밥과 단체 도시락을 만들어 왔습니다.</p>
    <p data-t>이제 무슬림 분들을 위한 할랄 도시락 사업을 서울에서 준비하고 있으며, KMF 할랄 인증을 받을 예정입니다.</p>
    <p data-t>실제 수요를 듣고 사업 계획을 세우려 합니다. 답변은 사업 계획과 지원사업 심사 자료에만 사용합니다.</p>
    <span class="mins" data-t>11월 12일(목)까지 답해 주시면 큰 도움이 됩니다.</span>
  </div>
  <section><div id="qs"></div></section>
  <div class="submit-area">
    <button class="send" id="send" type="button" data-t>보내기</button>
    <div class="msg" id="msg"></div>
  </div>
</div>

<div class="wrap done" id="done" hidden>
  <h2 data-t>고맙습니다!</h2>
  <p data-t>보내 주신 답은 사업 계획과 지원사업 심사 자료에만 사용합니다.</p>
</div>

I18N.en[PRIVACY] = "<b>Notice on collection and use of personal information</b>Items collected: organization name, contact person, contact details · Purpose: confirming demand, preparing our business plan and support program review and presentation materials, and sending news of the opening and tasting events (only if you answer “Yes, please” to question 12) · Retention: we keep them for 3 months from the date of collection and then delete them. You may take part in the survey without filling these in.";

var A = {};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

/* 화면 글자만 바꾸고, 시트에 쌓이는 답은 항상 한국어 값 그대로 + lang 칸 */
var LANG = "ko";
function tr(s){ var d = I18N[LANG]; return (d && d[s]) || s; }
function optHTML(q, v, kind){
  return '<label><input type="'+kind+'" name="'+q.id+'" value="'+esc(v)+'"><span>'+esc(tr(v))+'</span></label>';
}
function render(){
  var h = [];
  Q.forEach(function(q){
    h.push('<div class="q" data-q="'+q.id+'"'+(q.showIf?' hidden':'')+'><p class="qt"><span class="no">'+q.no+'</span> '+esc(tr(q.t))+(q.hint?' <span class="'+(q.req?'req':'opt')+'">· '+esc(tr(q.hint))+'</span>':'')+'</p>');
    if(q.type==="radio"||q.type==="check"){
      var kind = q.type==="radio"?"radio":"checkbox";
      h.push('<div class="choices">');q.o.forEach(function(v){h.push(optHTML(q,v,kind));});h.push('</div>');
    }else if(q.type==="text"){
      h.push('<textarea name="'+q.id+'" placeholder="'+esc(tr("자유롭게 적어 주세요"))+'"></textarea>');
    }else if(q.type==="photo"){
      h.push('<div class="photos">');
      PHOTOS.forEach(function(p){  /* 4장 고정 순서(빌더가 정한 순서 그대로) */
        h.push('<button type="button" class="ph" data-photo="'+q.id+'" data-v="'+esc(p.label)+'"><img src="'+p.img+'" alt="'+esc(tr(p.label))+'" loading="lazy"><div class="ck"></div><span>'+esc(tr(p.label))+'</span></button>');
      });
      h.push('</div><div class="choices">'+optHTML(q,q.none,"checkbox")+'</div>');
      h.push('<input type="text" class="other" data-other="'+q.id+'" placeholder="'+esc(tr("직접 적어 주세요"))+'" hidden>');
      h.push('<div class="cnt" data-cnt="'+q.id+'"></div>');
    }else if(q.type==="contact"){
      h.push('<p class="pv">'+tr(PRIVACY)+'</p>');
      h.push('<input type="text" name="org" placeholder="'+esc(tr("기관(회사)명"))+'">');
      h.push('<input type="text" name="person" placeholder="'+esc(tr("담당자"))+'">');
      h.push('<input type="text" name="contact" placeholder="'+esc(tr("연락처(전화번호 또는 메일)"))+'">');
    }
    h.push('</div>');
  });
  document.getElementById("qs").innerHTML = h.join("");
}
/* 언어 바꿔도 이미 고른 답·적은 글은 그대로 되살린다 */
function restore(saved){
  Object.keys(saved.vals).forEach(function(k){
    var el = qs.querySelector('[name="'+k+'"]:not([type=radio]):not([type=checkbox])');
    if(el) el.value = saved.vals[k];
  });
  saved.checked.forEach(function(c){
    var el = [].filter.call(qs.querySelectorAll('input[name="'+c[0]+'"]'), function(i){return i.value===c[1];})[0];
    if(el) el.checked = true;
  });
  saved.photos.forEach(function(p){
    var b = [].filter.call(qs.querySelectorAll('.ph[data-photo="'+p[0]+'"]'), function(x){return x.dataset.v===p[1];})[0];
    if(b) b.classList.add("on");
  });
  [].forEach.call(qs.querySelectorAll('[data-other]'), function(box){ if(saved.others[box.dataset.other]!==undefined) box.value = saved.others[box.dataset.other]; });
}
function snapshot(){
  var s = {vals:{}, checked:[], photos:[], others:{}};
  if(!qs) return s;
  [].forEach.call(qs.querySelectorAll('textarea,input[type=text]:not([data-other])'), function(e){ if(e.value) s.vals[e.name]=e.value; });
  [].forEach.call(qs.querySelectorAll('input:checked'), function(e){ s.checked.push([e.name,e.value]); });
  [].forEach.call(qs.querySelectorAll('.ph.on'), function(b){ s.photos.push([b.dataset.photo,b.dataset.v]); });
  [].forEach.call(qs.querySelectorAll('[data-other]'), function(b){ if(b.value) s.others[b.dataset.other]=b.value; });
  return s;
}
function setLang(l){
  var saved = snapshot();
  LANG = I18N[l] ? l : "ko";
  document.documentElement.lang = LANG;
  document.title = LANG==="en" ? "DailyHalal demand survey" : "DailyHalal 수요 설문";
  [].forEach.call(document.querySelectorAll("[data-t]"), function(el){
    if(!el.dataset.ko) el.dataset.ko = el.innerHTML;
    el.innerHTML = LANG==="ko" ? el.dataset.ko : tr(el.dataset.ko);
  });
  [].forEach.call(document.querySelectorAll("#langs button"), function(b){ b.classList.toggle("on", b.dataset.lang===LANG); });
  render(); restore(saved); collect();
}
var qs = null;
document.getElementById("langs").addEventListener("click", function(e){
  var b = e.target.closest("button[data-lang]"); if(b) setLang(b.dataset.lang);
});

qs = document.getElementById("qs");
qs.addEventListener("click", function(e){
  var b = e.target.closest(".ph"); if(!b) return;
  b.classList.toggle("on"); collect();
});
qs.addEventListener("change", collect);
qs.addEventListener("input", collect);

function flash(t){var m=document.getElementById("msg");m.textContent=t;setTimeout(function(){if(m.textContent===t)m.textContent="";},3500);}

function collect(){
  A = {};
  var shown = 0, answered = 0;
  Q.forEach(function(q){
    var box = qs.querySelector('[data-q="'+q.id+'"]');
    if(q.showIf){  /* 5-1 은 5번 「있다」일 때만 */
      var on = A[q.showIf[0]] === q.showIf[1];
      box.hidden = !on;
      if(!on){ var ta = box.querySelector("textarea"); if(ta) ta.value = ""; return; }
    }
    shown++;
    if(q.type==="photo"){
      var v = [].map.call(qs.querySelectorAll('.ph.on[data-photo="'+q.id+'"]'), function(b){return b.dataset.v;});
      var none = qs.querySelector('input[name="'+q.id+'"]:checked');
      var ob = qs.querySelector('[data-other="'+q.id+'"]');
      ob.hidden = !none;
      if(none){ v.push(q.none); if(ob.value.trim()) A[q.otherKey] = ob.value.trim(); }
      if(v.length) A[q.id]=v;
      qs.querySelector('[data-cnt="'+q.id+'"]').textContent = v.length? tr("{n}개 체크했어요").replace("{n}", v.length) : "";
    }else if(q.type==="contact"){
      ["org","person","contact"].forEach(function(k){ var x = qs.querySelector('[name="'+k+'"]').value.trim(); if(x) A[k]=x; });
    }else if(q.type==="text"){
      var t = qs.querySelector('[name="'+q.id+'"]').value.trim(); if(t) A[q.id]=t;
    }else{
      var vals = [].map.call(qs.querySelectorAll('input[name="'+q.id+'"]:checked'), function(i){return i.value;});
      if(vals.length) A[q.id] = q.type==="check"? vals : vals[0];
    }
    if(q.type==="contact"? (A.org||A.person||A.contact) : A[q.id]!==undefined) answered++;
    if(box) box.classList.remove("err");
  });
  document.getElementById("bar").style.width = Math.round(answered/shown*100)+"%";
}

document.getElementById("send").addEventListener("click", function(){
  collect();
  var miss = Q.filter(function(q){return q.req && A[q.id]===undefined;});
  if(miss.length){
    miss.forEach(function(q){ qs.querySelector('[data-q="'+q.id+'"]').classList.add("err"); });
    qs.querySelector('[data-q="'+miss[0].id+'"]').scrollIntoView({behavior:"smooth",block:"center"});
    flash(tr("12번에 답해 주세요")); return;
  }
  var btn = this; btn.disabled = true; btn.textContent = tr("보내는 중…");
  A.lang = LANG;
  var payload = {submitted_at: new Date().toISOString(), answers: A, ua: navigator.userAgent.slice(0,120)};
  function done(){ document.getElementById("form").hidden = true; document.getElementById("done").hidden = false; window.scrollTo(0,0); }
  function fail(){ btn.disabled = false; btn.textContent = tr("보내기"); flash(tr("보내지 못했어요. 잠시 뒤 다시 눌러 주세요")); }
  if(!SUBMIT_ENDPOINT){ console.log("[preview]", JSON.stringify(payload)); done(); return; }
  fetch(SUBMIT_ENDPOINT, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(payload)})
    .then(function(r){return r.json();}).then(function(j){ j && j.ok ? done() : fail(); }).catch(fail);
});

/* 첫 언어 = 주소 ?lang=en 이 있으면 그것, 없으면 한국어 */
(function(){ var m = /[?&]lang=(ko|en)/.exec(location.search); setLang(m ? m[1] : "ko"); })();
